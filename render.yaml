services:
  - type: web
    name: diploma-fulfillment
    env: python
    plan: free
    buildCommand: |
      python -m pip install -r diploma_project/requirements.txt
      python diploma_project/manage.py collectstatic --noinput
    startCommand: >
      bash -lc "python diploma_project/manage.py migrate --noinput &&
      gunicorn diploma_project.wsgi:application --chdir diploma_project"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: diploma-db
          property: connectionString

databases:
  - name: diploma-db
    plan: free

