{% extends 'core/base.html' %}

{% block title %}Open dispute{% endblock %}

{% block content %}
  <h2 class="mb-3">Open dispute</h2>
  <div class="mb-3 text-muted">
    Contribution to <strong>{{ contribution.request.title }}</strong> ({{ contribution.quantity }}) • Code: {{ contribution.verification_code }}
  </div>

  <form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-danger" type="submit">Submit dispute</button>
    <a class="btn btn-link" href="{% url 'dashboard' %}">Cancel</a>
  </form>
{% endblock %}
